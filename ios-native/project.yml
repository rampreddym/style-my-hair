name: Mirra
options:
  bundleIdPrefix: com.hairhalo
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios-spm
    from: 24.0.0
targets:
  Mirra:
    type: application
    platform: iOS
    sources: [Mirra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hairhalo.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Mirra/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mirra/Resources/Mirra.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Supabase
      - package: StripePaymentSheet
        product: StripePaymentSheet
